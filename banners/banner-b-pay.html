<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>비무브짐24 배너 B</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Alfa+Slab+One&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>

* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1080px; overflow:hidden; }
body { font-family:'Noto Sans KR', sans-serif; }
.bhs { font-family:'Black Han Sans', sans-serif; font-weight:400; }
.slab { font-family:'Alfa Slab One', serif; font-weight:400; }
.orange { color:#ee6325; }
.canvas { width:1080px; height:1080px; position:relative; display:flex; flex-direction:column; }

.canvas {
  background:
    radial-gradient(ellipse 900px 560px at 50% -8%, rgba(238,99,37,.16), transparent 60%),
    linear-gradient(180deg, #0d0e10 0%, #17191d 100%);
  color:#fff; padding:56px 66px 52px; align-items:center; text-align:center;
}
.brand { display:flex; align-items:center; gap:16px; }
.brand img { width:74px; height:74px; }
.brand p { font-size:30px; color:#fff; } .brand em { font-style:normal; color:#ee6325; }
.flag {
  margin-top:30px; background:#c9302c; color:#fff; font-size:30px;
  padding:12px 42px; border-radius:999px; box-shadow:0 10px 30px rgba(201,48,44,.4);
}
h1 { font-size:118px; line-height:1.14; margin-top:24px; word-break:keep-all; white-space:nowrap; }
h1 .y { color:#ffd54f; }
.subs { font-size:29px; color:#cfd2d5; margin-top:14px; font-weight:500; }
.cards { display:flex; gap:16px; margin-top:36px; width:100%; }
.cards figure { flex:1; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,.12); }
.cards .body { background:#1d2027; padding:24px 22px 20px; text-align:left; }
.cards .org { display:flex; align-items:center; gap:9px; font-size:22px; color:#d7d9dd; font-weight:500; }
.cards .dot { width:20px; height:20px; border-radius:50%; background:#19c37d; }
.cards .amt { font-size:36px; font-weight:700; margin-top:10px; font-variant-numeric:tabular-nums; }
.cards figcaption { background:#000; color:#ffd54f; font-family:'Black Han Sans'; font-size:33px; padding:13px 6px; font-variant-numeric:tabular-nums; }
.cta { margin-top:auto; font-size:28px; font-weight:700; color:#e2e4e6; }
.cta b { color:#ee6325; }
</style></head><body>
<div class="canvas">
  <div class="brand"><img src="logo-badge.png" alt=""><p class="slab">BE:MOVE <em>FITNESS</em></p></div>
  <p class="flag bhs">실제 급여 지급 내역</p>
  <h1 class="bhs">평균 급여<br><span class="y">월 500만원</span> 이상</h1>
  <p class="subs">비무브짐에 근무 중인 선생님들의 실제 급여입니다</p>
  <div class="cards">
    <figure><div class="body"><p class="org"><span class="dot"></span>(주)비무브짐</p><p class="amt">+9,627,605 원</p></div><figcaption>9,627,605원</figcaption></figure>
    <figure><div class="body"><p class="org"><span class="dot"></span>(주)비무브짐</p><p class="amt">+8,037,337 원</p></div><figcaption>8,037,337원</figcaption></figure>
    <figure><div class="body"><p class="org"><span class="dot"></span>(주)비무브짐</p><p class="amt">+7,040,038 원</p></div><figcaption>7,040,038원</figcaption></figure>
  </div>
  <p class="cta">열정과 태도만 준비하세요 — <b>비무브짐24 트레이너 공개 채용</b></p>
</div>
</body></html>
