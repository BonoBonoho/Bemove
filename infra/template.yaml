AWSTemplateFormatVersion: "2010-09-09"
Description: BE:MOVE GYM 채용 사이트 백엔드 (Lambda + HTTP API + DynamoDB)

Parameters:
  CodeBucket:
    Type: String
    Description: 람다 코드 zip이 올라간 S3 버킷
  CodeKey:
    Type: String
    Default: backend.zip
  AdminToken:
    Type: String
    NoEcho: true
    Description: 어드민 페이지 인증 토큰

Resources:
  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bemove-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  AppsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: bemove-applications
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  FnRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ddb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt JobsTable.Arn
                  - !GetAtt AppsTable.Arn

  ApiFn:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: bemove-recruit-api
      Runtime: nodejs20.x
      Handler: index.handler
      Timeout: 10
      MemorySize: 256
      Role: !GetAtt FnRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CodeKey
      Environment:
        Variables:
          JOBS_TABLE: !Ref JobsTable
          APPS_TABLE: !Ref AppsTable
          ADMIN_TOKEN: !Ref AdminToken

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: bemove-recruit
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders: ["content-type", "x-admin-token"]
        AllowMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFn.Arn
      PayloadFormatVersion: "2.0"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${Integration}

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  FnPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiUrl:
    Description: 채용 API 엔드포인트 (js/config.js의 apiUrl에 입력)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
